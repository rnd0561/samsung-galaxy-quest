<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Galaxy Jump - Samsung Training</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: #1a1a2e;
        }

        /* Экраны */
        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.3s;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Меню */
        .menu-screen {
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
        }

        .logo {
            font-size: clamp(2.5rem, 10vw, 4rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }

        .logo-sub {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            color: rgba(255,255,255,0.9);
            margin-bottom: 40px;
        }

        .btn {
            padding: 18px 50px;
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-play {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
        }

        .btn-worlds {
            background: rgba(255,255,255,0.2);
            color: #fff;
            backdrop-filter: blur(10px);
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-top: 40px;
        }

        .stat {
            text-align: center;
            color: #fff;
        }

        .stat-num {
            font-size: 2rem;
            font-weight: 900;
        }

        .stat-label {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Выбор уровня */
        .levels-screen {
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
            overflow-y: auto;
        }

        .levels-title {
            font-size: 1.8rem;
            color: #fff;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            max-width: 400px;
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
        }

        .level-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: transform 0.2s;
        }

        .level-btn:active {
            transform: scale(0.9);
        }

        .level-btn.available {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .level-btn.completed {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }

        .level-btn.locked {
            background: rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.4);
        }

        .level-btn .stars {
            font-size: 0.6rem;
        }

        /* Игра */
        .game-screen {
            padding: 0;
            background: #1a1a2e;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD */
        .hud {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%);
            z-index: 100;
        }

        .hud-left, .hud-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .hud-item {
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-item .icon {
            font-size: 1.3rem;
        }

        .hud-back {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Обучение попап */
        .learn-popup {
            position: fixed;
            bottom: 100px;
            left: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 20px;
            color: #fff;
            z-index: 200;
            transform: translateY(200%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .learn-popup.show {
            transform: translateY(0);
        }

        .learn-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .learn-text {
            font-size: 0.95rem;
            opacity: 0.9;
            line-height: 1.4;
        }

        /* Тест экран */
        .test-screen {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            padding: 20px;
            overflow-y: auto;
        }

        .test-title {
            font-size: clamp(1.5rem, 5vw, 2rem);
            color: #fff;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
        }

        .test-subtitle {
            color: rgba(255,255,255,0.7);
            margin-bottom: 25px;
            text-align: center;
        }

        .test-options {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .test-option {
            padding: 16px 20px;
            background: rgba(255,255,255,0.1);
            border: 2px solid transparent;
            border-radius: 15px;
            color: #fff;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .test-option:active {
            transform: scale(0.98);
        }

        .test-option.selected {
            background: rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }

        .test-option.correct {
            background: rgba(56, 239, 125, 0.3);
            border-color: #38ef7d;
        }

        .test-option.wrong {
            background: rgba(245, 87, 108, 0.3);
            border-color: #f5576c;
        }

        .test-btn {
            margin-top: 25px;
            padding: 16px 40px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Результат */
        .result-screen {
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
        }

        .result-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 2rem;
            color: #fff;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .result-text {
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
            text-align: center;
        }

        /* Управление */
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            display: flex;
            justify-content: space-between;
            padding: 20px 30px;
            z-index: 100;
        }

        .ctrl-side {
            width: 100px;
            height: 80px;
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: rgba(255,255,255,0.6);
        }

        .ctrl-side:active {
            background: rgba(255,255,255,0.3);
        }
    </style>
</head>
<body>
    <!-- МЕНЮ -->
    <div class="screen menu-screen" id="menuScreen">
        <div class="logo">GALAXY JUMP</div>
        <div class="logo-sub">Samsung Training Game</div>
        <button class="btn btn-play" onclick="playGame()">ИГРАТЬ</button>
        <button class="btn btn-worlds" onclick="showLevels()">УРОВНИ</button>
        <div class="stats">
            <div class="stat">
                <div class="stat-num" id="statLevels">0</div>
                <div class="stat-label">Уровней</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="statStars">0</div>
                <div class="stat-label">Звёзд</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="statCoins">0</div>
                <div class="stat-label">Монет</div>
            </div>
        </div>
    </div>

    <!-- УРОВНИ -->
    <div class="screen levels-screen hidden" id="levelsScreen">
        <div class="levels-title">ВЫБЕРИ УРОВЕНЬ</div>
        <div class="levels-grid" id="levelsGrid"></div>
        <button class="btn btn-worlds" onclick="showMenu()" style="margin-top:20px">НАЗАД</button>
    </div>

    <!-- ИГРА -->
    <div class="screen game-screen hidden" id="gameScreen">
        <div class="hud">
            <div class="hud-left">
                <button class="hud-back" onclick="showMenu()">✕</button>
                <div class="hud-item"><span class="icon">⭐</span><span id="hudStars">0/3</span></div>
            </div>
            <div class="hud-right">
                <div class="hud-item"><span class="icon">🪙</span><span id="hudCoins">0</span></div>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div class="controls">
            <div class="ctrl-side" id="ctrlLeft">◀</div>
            <div class="ctrl-side" id="ctrlRight">▶</div>
        </div>
        <div class="learn-popup" id="learnPopup">
            <div class="learn-title"><span>⭐</span> <span id="learnTitle">Фишка</span></div>
            <div class="learn-text" id="learnText">Описание фишки</div>
        </div>
    </div>

    <!-- ТЕСТ -->
    <div class="screen test-screen hidden" id="testScreen">
        <div class="test-title" id="testTitle">🏆 ФИНАЛЬНЫЙ ТЕСТ</div>
        <div class="test-subtitle" id="testSubtitle">Выбери 3 главные фишки устройства:</div>
        <div class="test-options" id="testOptions"></div>
        <button class="test-btn" onclick="checkTest()">ПРОВЕРИТЬ</button>
    </div>

    <!-- РЕЗУЛЬТАТ -->
    <div class="screen result-screen hidden" id="resultScreen">
        <div class="result-icon" id="resultIcon">🎉</div>
        <div class="result-title" id="resultTitle">УРОВЕНЬ ПРОЙДЕН!</div>
        <div class="result-text" id="resultText">Вы изучили все фишки устройства</div>
        <button class="btn btn-play" onclick="nextLevel()">ДАЛЬШЕ</button>
        <button class="btn btn-worlds" onclick="showMenu()">МЕНЮ</button>
    </div>

    <script>
    // ===== ДАННЫЕ =====
    const DEVICES = [
        { name: "Galaxy A56", f: ["Сила интеллекта", "Совершенство в каждом кадре", "Крутая производительность"], d: ["Функция «Обвести и найти», AI рекомендации, создание фотофильтров с AI", "50 МП камера с OIS, HDR-съёмка, портретная съёмка с AI", "Супербыстрая зарядка 45 Вт, 4 нм процессор, продвинутое охлаждение"] },
        { name: "Galaxy S25 Ultra", f: ["Решай задачи по-новому", "Играй по-новому", "Создавай контент по-новому"], d: ["AI поиск, голосовой помощник, статус-виджет", "3 нм Snapdragon 8 Elite, сверхскоростная AI обработка", "200 МП камера, AI зум, ассистент по видео"] },
        { name: "Galaxy S25", f: ["Решай задачи по-новому", "Играй по-новому", "Создавай контент по-новому"], d: ["Интуитивный AI поиск, мгновенные задачи", "Первый 3 нм процессор в линейке Galaxy S", "Чёткие портреты, плавность зума"] },
        { name: "Galaxy S25+", f: ["Решай задачи по-новому", "Играй по-новому", "Создавай контент по-новому"], d: ["Интуитивный AI поиск, статус-виджет", "3 нм Snapdragon 8 Elite суперпроцессор", "Портреты, AI зум, ассистент видео"] },
        { name: "Galaxy Z Fold6", f: ["Сила интеллекта и творчества", "Камера как в Z Flip7", "Крутая производительность и надежность"], d: ["Заметки с AI-переводом, сводка текста", "Флекс-камера, зум x2, автокадрирование", "Snapdragon 8 Gen 3, IP48, броня"] },
        { name: "Galaxy Z Flip6", f: ["Сила интеллекта и творчества", "Камера как в Z Flip7", "Крутая производительность"], d: ["AI-ответы, переводчик, виджеты", "50 МП камера, автокадрирование", "Snapdragon 8 Gen 3, 4000 мАч"] },
        { name: "Galaxy A55", f: ["Сила интеллекта", "Совершенство в каждом кадре", "Крутая производительность"], d: ["Обвести и найти, AI рекомендации", "50 МП с OIS, ночная съёмка, HDR", "Зарядка 25 Вт, 5 нм процессор"] },
        { name: "Galaxy A35", f: ["Сила интеллекта", "Совершенство в каждом кадре", "Крутая производительность"], d: ["AI рекомендации, Smart Switch", "50 МП камера, портреты", "5000 мАч, 25 Вт зарядка"] },
        { name: "Galaxy A16", f: ["Экран на максимум", "Надёжность", "Крутая производительность"], d: ["6.7\" FHD+ Super AMOLED 90 Гц", "IP54, 6 лет обновлений", "5000 мАч, 25 Вт зарядка"] },
        { name: "Galaxy A06", f: ["Экран на максимум", "Совершенство в каждом кадре", "Крутая производительность"], d: ["6.7\" HD+ 60 Гц экран", "50 МП камера, портреты", "5000 мАч батарея"] },
        { name: "Galaxy S24 FE", f: ["Сила интеллекта", "Совершенство в каждом кадре", "Крутая производительность"], d: ["Galaxy AI, обвести и найти", "50 МП камера с 3x зумом", "Exynos 2400e, 4700 мАч"] },
        { name: "Galaxy Tab S10 Ultra", f: ["Сила интеллекта и творчества", "Экран на максимум", "Крутая производительность"], d: ["Помощник заметок, перевод PDF", "14.6\" Dynamic AMOLED 2X, 120 Гц", "MediaTek Dimensity 9300+, 11200 мАч"] },
        { name: "Galaxy Tab S10+", f: ["Сила интеллекта и творчества", "Экран на максимум", "Крутая производительность"], d: ["Galaxy AI в заметках", "12.4\" Dynamic AMOLED 2X", "MediaTek Dimensity 9300+"] },
        { name: "Galaxy Tab A9+", f: ["Экран на максимум", "Крутая производительность", "Развлечения"], d: ["11\" TFT LCD экран, стерео", "8 ГБ ОЗУ, быстрый процессор", "Мультиоконность, Samsung TV+"] },
        { name: "Galaxy Tab S6 Lite 2024", f: ["Сила интеллекта и творчества", "Экран на максимум", "Крутая производительность"], d: ["S Pen в комплекте, Galaxy AI", "10.4\" TFT экран", "8 ГБ ОЗУ, 128 ГБ память"] },
        { name: "Galaxy Watch Ultra", f: ["Надежность", "Здоровье", "Умные функции"], d: ["Титановый корпус 47 мм, 10 ATM, IP68", "Пульс, ЭКГ, кислород, сон, стресс", "Dual-GPS, двойная кнопка, eSIM"] },
        { name: "Galaxy Watch7", f: ["Здоровье", "Умные функции", "Стиль"], d: ["BioActive датчик, AGEs индекс, Energy Score", "Wear OS, Google Карты, Wallet", "Алюминий/сталь, сменные ремешки"] },
        { name: "Galaxy Watch FE", f: ["Здоровье", "Умные функции", "Стиль"], d: ["Пульс, ЭКГ, сон, циклы", "Wear OS, Google Assistant", "Алюминий 40 мм, ремешки"] },
        { name: "Galaxy Buds3 Pro", f: ["Звук на максимум", "Умные функции", "Комфорт"], d: ["2-полосный динамик, 24-бит Hi-Fi, ANC", "Адаптивный ANC, 360 Audio", "Blade Lights, IP57, 7 ч работы"] },
        { name: "Galaxy Buds3", f: ["Звук на максимум", "Умные функции", "Комфорт"], d: ["11 мм динамик, AAC/SSC кодеки", "Адаптивный ANC, авто-переключение", "Open-type дизайн, 6 ч работы"] },
        { name: "Galaxy Buds FE", f: ["Звук на максимум", "Умные функции", "Комфорт"], d: ["ANC, 3 микрофона", "360 Audio, авто-переключение", "IPX2, 8.5 ч работы"] },
        { name: "Galaxy Ring", f: ["Здоровье", "Комфорт", "Умные функции"], d: ["Пульс, сон, шаги, циклы", "Титан, 2.6 г, 7 дней батареи", "Galaxy AI анализ, Find My Ring"] },
        { name: "Galaxy Book5 Pro 360", f: ["Сила интеллекта", "Экран на максимум", "Крутая производительность"], d: ["Intel Core Ultra, NPU 47 TOPS", "16\" 3K AMOLED сенсорный, S Pen", "Intel Arc GPU, Wi-Fi 7"] }
    ];

    // ===== СОСТОЯНИЕ =====
    const G = {
        level: 0,
        completed: [],
        totalStars: 0,
        totalCoins: 0,
        // Игра
        px: 0,
        py: 0,
        vx: 0,
        vy: 0,
        platforms: [],
        stars: [],
        coins: [],
        collectedStars: [],
        levelCoins: 0,
        cameraY: 0,
        finishY: 0,
        gameLoop: null,
        moveLeft: false,
        moveRight: false,
        gameOver: false,
        reachedFinish: false
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ===== УТИЛИТЫ =====
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function save() {
        localStorage.setItem('galaxyJump', JSON.stringify({
            completed: G.completed,
            totalStars: G.totalStars,
            totalCoins: G.totalCoins,
            level: G.level
        }));
    }

    function load() {
        const data = JSON.parse(localStorage.getItem('galaxyJump') || '{}');
        G.completed = data.completed || [];
        G.totalStars = data.totalStars || 0;
        G.totalCoins = data.totalCoins || 0;
        G.level = data.level || 0;
        updateStats();
    }

    function updateStats() {
        document.getElementById('statLevels').textContent = G.completed.length;
        document.getElementById('statStars').textContent = G.totalStars;
        document.getElementById('statCoins').textContent = G.totalCoins;
    }

    // ===== МЕНЮ =====
    function showMenu() {
        stopGame();
        updateStats();
        showScreen('menuScreen');
    }

    function showLevels() {
        const grid = document.getElementById('levelsGrid');
        grid.innerHTML = '';
        
        DEVICES.forEach((dev, i) => {
            const completed = G.completed.includes(i);
            const available = i === 0 || G.completed.includes(i - 1) || completed;
            
            const btn = document.createElement('button');
            btn.className = `level-btn ${completed ? 'completed' : available ? 'available' : 'locked'}`;
            btn.innerHTML = `
                <span>${i + 1}</span>
                <span class="stars">${completed ? '⭐⭐⭐' : '☆☆☆'}</span>
            `;
            
            if (available) {
                btn.onclick = () => { G.level = i; startGame(); };
            }
            
            grid.appendChild(btn);
        });
        
        showScreen('levelsScreen');
    }

    function playGame() {
        // Найти первый непройденный уровень
        for (let i = 0; i < DEVICES.length; i++) {
            if (!G.completed.includes(i)) {
                G.level = i;
                break;
            }
        }
        startGame();
    }

    // ===== ИГРА =====
    function startGame() {
        showScreen('gameScreen');
        resizeCanvas();
        initLevel();
        G.gameLoop = requestAnimationFrame(gameLoop);
    }

    function stopGame() {
        if (G.gameLoop) {
            cancelAnimationFrame(G.gameLoop);
            G.gameLoop = null;
        }
        hideLearnPopup();
    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function initLevel() {
        const dev = DEVICES[G.level];
        
        // Сброс состояния
        G.px = canvas.width / 2;
        G.py = canvas.height - 100;
        G.vx = 0;
        G.vy = 0;
        G.cameraY = 0;
        G.platforms = [];
        G.stars = [];
        G.coins = [];
        G.collectedStars = [];
        G.levelCoins = 0;
        G.gameOver = false;
        G.reachedFinish = false;

        // Высота уровня
        const levelHeight = 3000;
        G.finishY = -levelHeight + 200;

        // Стартовая платформа
        G.platforms.push({
            x: canvas.width / 2 - 60,
            y: canvas.height - 50,
            w: 120
        });

        // Генерация платформ
        let y = canvas.height - 150;
        while (y > G.finishY) {
            const x = Math.random() * (canvas.width - 100) + 20;
            const w = 60 + Math.random() * 40;
            G.platforms.push({ x, y, w });
            y -= 80 + Math.random() * 40;
        }

        // Звёзды (3 штуки - по одной на каждую фишку)
        const starPositions = [
            canvas.height - 600,
            canvas.height - 1400,
            canvas.height - 2200
        ];
        
        dev.f.forEach((feature, i) => {
            const plat = G.platforms.find(p => Math.abs(p.y - starPositions[i]) < 100) || G.platforms[5 + i * 8];
            if (plat) {
                G.stars.push({
                    x: plat.x + plat.w / 2,
                    y: plat.y - 50,
                    idx: i,
                    collected: false
                });
            }
        });

        // Монеты
        G.platforms.forEach((p, i) => {
            if (i > 0 && Math.random() > 0.5) {
                G.coins.push({
                    x: p.x + p.w / 2,
                    y: p.y - 40,
                    collected: false
                });
            }
        });

        // HUD
        document.getElementById('hudStars').textContent = '0/3';
        document.getElementById('hudCoins').textContent = '0';
    }

    function gameLoop() {
        if (G.gameOver) return;
        
        update();
        render();
        G.gameLoop = requestAnimationFrame(gameLoop);
    }

    function update() {
        const gravity = 0.35;
        const speed = 6;
        const jumpForce = -12;

        // Движение влево/вправо
        if (G.moveLeft) {
            G.vx = -speed;
        } else if (G.moveRight) {
            G.vx = speed;
        } else {
            G.vx *= 0.9;
        }

        // Гравитация
        G.vy += gravity;

        // Позиция
        G.px += G.vx;
        G.py += G.vy;

        // Границы экрана (wrap)
        if (G.px < -20) G.px = canvas.width + 20;
        if (G.px > canvas.width + 20) G.px = -20;

        // Коллизия с платформами (только при падении)
        if (G.vy > 0) {
            G.platforms.forEach(p => {
                const relY = p.y - G.cameraY;
                if (G.px > p.x - 10 && G.px < p.x + p.w + 10) {
                    if (G.py > relY - 30 && G.py < relY + 10) {
                        G.py = relY - 30;
                        G.vy = jumpForce;
                    }
                }
            });
        }

        // Сбор звёзд
        G.stars.forEach(s => {
            if (s.collected) return;
            const relY = s.y - G.cameraY;
            const dx = G.px - s.x;
            const dy = G.py - relY;
            if (Math.sqrt(dx * dx + dy * dy) < 40) {
                s.collected = true;
                G.collectedStars.push(s.idx);
                document.getElementById('hudStars').textContent = `${G.collectedStars.length}/3`;
                showLearnPopup(s.idx);
            }
        });

        // Сбор монет
        G.coins.forEach(c => {
            if (c.collected) return;
            const relY = c.y - G.cameraY;
            const dx = G.px - c.x;
            const dy = G.py - relY;
            if (Math.sqrt(dx * dx + dy * dy) < 30) {
                c.collected = true;
                G.levelCoins++;
                document.getElementById('hudCoins').textContent = G.levelCoins;
            }
        });

        // Камера следует за игроком вверх
        const targetCameraY = Math.min(0, G.py - canvas.height / 2 + G.cameraY);
        if (G.py < canvas.height / 2) {
            G.cameraY += (G.py - canvas.height / 2) * 0.1;
        }

        // Проверка финиша
        if (G.cameraY < G.finishY + canvas.height && !G.reachedFinish) {
            if (G.collectedStars.length === 3) {
                G.reachedFinish = true;
                G.gameOver = true;
                setTimeout(() => showTest(), 500);
            }
        }

        // Падение вниз = проигрыш
        if (G.py > canvas.height + 100) {
            G.gameOver = true;
            showResult(false, 'Вы упали! Попробуйте снова.');
        }
    }

    function render() {
        // Фон - градиент
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#0f0c29');
        grad.addColorStop(0.5, '#302b63');
        grad.addColorStop(1, '#24243e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Звёзды на фоне
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        for (let i = 0; i < 50; i++) {
            const x = (i * 73) % canvas.width;
            const y = ((i * 137 - G.cameraY * 0.3) % (canvas.height + 200)) - 100;
            ctx.beginPath();
            ctx.arc(x, y, 1 + (i % 2), 0, Math.PI * 2);
            ctx.fill();
        }

        // Платформы
        G.platforms.forEach(p => {
            const y = p.y - G.cameraY;
            if (y < -50 || y > canvas.height + 50) return;
            
            // Градиент платформы
            const platGrad = ctx.createLinearGradient(p.x, y, p.x, y + 15);
            platGrad.addColorStop(0, '#667eea');
            platGrad.addColorStop(1, '#764ba2');
            
            ctx.fillStyle = platGrad;
            ctx.beginPath();
            ctx.roundRect(p.x, y, p.w, 15, 8);
            ctx.fill();
            
            // Свечение
            ctx.shadowColor = '#667eea';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
        });

        // Монеты
        G.coins.forEach(c => {
            if (c.collected) return;
            const y = c.y - G.cameraY;
            if (y < -50 || y > canvas.height + 50) return;
            
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(c.x, y, 12, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffec8b';
            ctx.beginPath();
            ctx.arc(c.x - 3, y - 3, 4, 0, Math.PI * 2);
            ctx.fill();
        });

        // Звёзды (collectibles)
        G.stars.forEach(s => {
            if (s.collected) return;
            const y = s.y - G.cameraY;
            if (y < -50 || y > canvas.height + 50) return;
            
            drawStar(s.x, y, 20, '#ffd700', '#ff6b6b');
        });

        // Финишная линия
        const finishScreenY = G.finishY - G.cameraY;
        if (finishScreenY > -100 && finishScreenY < canvas.height + 100) {
            ctx.fillStyle = G.collectedStars.length === 3 ? '#38ef7d' : '#ff6b6b';
            ctx.fillRect(0, finishScreenY, canvas.width, 5);
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(G.collectedStars.length === 3 ? '🏁 ФИНИШ' : '⭐ Собери все звёзды!', canvas.width / 2, finishScreenY - 15);
        }

        // Персонаж
        drawPlayer(G.px, G.py);
    }

    function drawStar(x, y, size, color1, color2) {
        ctx.save();
        ctx.translate(x, y);
        
        // Свечение
        ctx.shadowColor = color1;
        ctx.shadowBlur = 15;
        
        ctx.fillStyle = color1;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const angle = (i * 4 * Math.PI) / 5 - Math.PI / 2;
            const r = i === 0 ? size : size;
            ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
            
            const angle2 = angle + (2 * Math.PI) / 10;
            ctx.lineTo(Math.cos(angle2) * (size * 0.4), Math.sin(angle2) * (size * 0.4));
        }
        ctx.closePath();
        ctx.fill();
        
        ctx.shadowBlur = 0;
        ctx.restore();
    }

    function drawPlayer(x, y) {
        ctx.save();
        ctx.translate(x, y);

        // Тело - круг с градиентом
        const bodyGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 25);
        bodyGrad.addColorStop(0, '#667eea');
        bodyGrad.addColorStop(1, '#764ba2');
        
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.fill();

        // Samsung надпись
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 8px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('SAMSUNG', 0, 3);

        // Глаза
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-8, -8, 6, 0, Math.PI * 2);
        ctx.arc(8, -8, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.arc(-6, -8, 3, 0, Math.PI * 2);
        ctx.arc(10, -8, 3, 0, Math.PI * 2);
        ctx.fill();

        // Улыбка
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0.2, Math.PI - 0.2);
        ctx.stroke();

        ctx.restore();
    }

    // ===== ОБУЧЕНИЕ =====
    function showLearnPopup(idx) {
        const dev = DEVICES[G.level];
        document.getElementById('learnTitle').textContent = dev.f[idx];
        document.getElementById('learnText').textContent = dev.d[idx];
        document.getElementById('learnPopup').classList.add('show');
        
        setTimeout(hideLearnPopup, 3000);
    }

    function hideLearnPopup() {
        document.getElementById('learnPopup').classList.remove('show');
    }

    // ===== ТЕСТ =====
    function showTest() {
        stopGame();
        
        const dev = DEVICES[G.level];
        document.getElementById('testTitle').textContent = `🏆 ТЕСТ: ${dev.name}`;
        document.getElementById('testSubtitle').textContent = 'Выбери 3 главные фишки этого устройства:';
        
        // Собираем все фишки
        const allFeatures = new Set();
        DEVICES.forEach(d => d.f.forEach(f => allFeatures.add(f)));
        
        const correct = dev.f;
        const wrong = [...allFeatures].filter(f => !correct.includes(f));
        const shuffledWrong = wrong.sort(() => Math.random() - 0.5).slice(0, 3);
        const options = [...correct, ...shuffledWrong].sort(() => Math.random() - 0.5);

        const optionsDiv = document.getElementById('testOptions');
        optionsDiv.innerHTML = '';
        
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'test-option';
            btn.textContent = opt;
            btn.dataset.feature = opt;
            btn.onclick = function() {
                const selected = document.querySelectorAll('.test-option.selected');
                if (this.classList.contains('selected')) {
                    this.classList.remove('selected');
                } else if (selected.length < 3) {
                    this.classList.add('selected');
                }
            };
            optionsDiv.appendChild(btn);
        });

        showScreen('testScreen');
    }

    function checkTest() {
        const dev = DEVICES[G.level];
        const options = document.querySelectorAll('.test-option');
        const selected = [...document.querySelectorAll('.test-option.selected')].map(b => b.dataset.feature);
        
        let correctCount = 0;
        
        options.forEach(btn => {
            btn.onclick = null;
            const f = btn.dataset.feature;
            const isCorrect = dev.f.includes(f);
            const isSelected = selected.includes(f);
            
            if (isCorrect) {
                btn.classList.add('correct');
                if (isSelected) correctCount++;
            } else if (isSelected) {
                btn.classList.add('wrong');
            }
        });

        setTimeout(() => {
            if (correctCount === 3) {
                // Успех
                if (!G.completed.includes(G.level)) {
                    G.completed.push(G.level);
                    G.totalStars += 3;
                }
                G.totalCoins += G.levelCoins;
                save();
                showResult(true, `Вы изучили ${dev.name}!`);
            } else {
                showResult(false, `Правильно: ${correctCount}/3. Попробуйте ещё раз!`);
            }
        }, 1500);
    }

    // ===== РЕЗУЛЬТАТ =====
    function showResult(success, text) {
        document.getElementById('resultIcon').textContent = success ? '🎉' : '😔';
        document.getElementById('resultTitle').textContent = success ? 'УРОВЕНЬ ПРОЙДЕН!' : 'НЕ ПОЛУЧИЛОСЬ';
        document.getElementById('resultText').textContent = text;
        
        showScreen('resultScreen');
    }

    function nextLevel() {
        G.level++;
        if (G.level >= DEVICES.length) {
            G.level = 0;
        }
        startGame();
    }

    // ===== УПРАВЛЕНИЕ =====
    // Клавиатура
    document.addEventListener('keydown', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') G.moveLeft = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') G.moveRight = true;
    });

    document.addEventListener('keyup', e => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') G.moveLeft = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') G.moveRight = false;
    });

    // Тач
    const ctrlLeft = document.getElementById('ctrlLeft');
    const ctrlRight = document.getElementById('ctrlRight');

    function setupControl(el, key) {
        const start = () => { G[key] = true; };
        const end = () => { G[key] = false; };
        
        el.addEventListener('mousedown', start);
        el.addEventListener('touchstart', e => { e.preventDefault(); start(); });
        el.addEventListener('mouseup', end);
        el.addEventListener('mouseleave', end);
        el.addEventListener('touchend', end);
        el.addEventListener('touchcancel', end);
    }

    setupControl(ctrlLeft, 'moveLeft');
    setupControl(ctrlRight, 'moveRight');

    // Resize
    window.addEventListener('resize', resizeCanvas);

    // ===== INIT =====
    load();
    </script>
</body>
