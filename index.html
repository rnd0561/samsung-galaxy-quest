<html lang="ru">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1428a0;
            --primary-dark: #0d1a6b;
            --primary-light: #2196f3;
            --bg: #f4f7f6;
            --white: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #5a5a7a;
            --success: #00c853;
            --error: #ff5252;
            --border: #e8eaed;
            --shadow: 0 2px 12px rgba(20, 40, 160, 0.08);
            --radius: 12px;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ===== LAYOUT ===== */
        .app {
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 280px;
            background: var(--white);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 24px 20px;
            background: var(--primary);
            color: var(--white);
        }

        .sidebar-logo {
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-subtitle {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 4px;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
        }

        .nav-category {
            padding: 0 16px;
            margin-bottom: 8px;
        }

        .nav-category-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 8px 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            color: var(--text);
        }

        .nav-item:hover {
            background: var(--bg);
        }

        .nav-item.active {
            background: rgba(20, 40, 160, 0.1);
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item-icon {
            font-size: 1.2rem;
            width: 28px;
            text-align: center;
        }

        .nav-item-badge {
            margin-left: auto;
            background: var(--success);
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 600;
        }

        /* ===== MAIN CONTENT ===== */
        .main {
            flex: 1;
            margin-left: 280px;
            padding: 32px 40px;
            max-width: 1200px;
        }

        /* ===== MOBILE HEADER ===== */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--primary);
            color: white;
            align-items: center;
            padding: 0 16px;
            z-index: 200;
            gap: 16px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 8px;
        }

        .mobile-title {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
        }

        .overlay.show {
            display: block;
        }

        /* ===== DEVICE HEADER ===== */
        .device-header {
            margin-bottom: 32px;
        }

        .device-category {
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .device-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .device-title-icon {
            font-size: 2.5rem;
        }

        .device-tagline {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
        }

        /* ===== 3 CHIPS ===== */
        .device-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .device-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(20, 40, 160, 0.25);
        }

        .device-chip-icon {
            font-size: 1rem;
        }

        /* ===== FAB SECTION ===== */
        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--primary);
            border-radius: 2px;
        }

        .fab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .fab-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .fab-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(20, 40, 160, 0.12);
        }

        .fab-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 16px;
        }

        .fab-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .fab-label.feature {
            background: rgba(20, 40, 160, 0.1);
            color: var(--primary);
        }

        .fab-label.advantage {
            background: rgba(33, 150, 243, 0.1);
            color: var(--primary-light);
        }

        .fab-label.benefit {
            background: rgba(0, 200, 83, 0.1);
            color: var(--success);
        }

        .fab-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .fab-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ===== SPECS TABLE ===== */
        .specs-section {
            margin-bottom: 40px;
        }

        .specs-table {
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .specs-row {
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .specs-row:last-child {
            border-bottom: none;
        }

        .specs-label {
            width: 180px;
            padding: 16px 20px;
            background: var(--bg);
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .specs-label-icon {
            font-size: 1.1rem;
        }

        .specs-value {
            flex: 1;
            padding: 16px 20px;
            font-size: 0.9rem;
            color: var(--text);
        }

        /* ===== QUIZ SECTION ===== */
        .quiz-section {
            background: var(--white);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .quiz-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quiz-question {
            font-size: 1.05rem;
            color: var(--text);
            margin-bottom: 20px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quiz-option {
            padding: 14px 18px;
            background: var(--bg);
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .quiz-option:hover {
            border-color: var(--primary);
            background: rgba(20, 40, 160, 0.05);
        }

        .quiz-option.selected {
            border-color: var(--primary);
            background: rgba(20, 40, 160, 0.1);
        }

        .quiz-option.correct {
            border-color: var(--success);
            background: rgba(0, 200, 83, 0.1);
        }

        .quiz-option.incorrect {
            border-color: var(--error);
            background: rgba(255, 82, 82, 0.1);
        }

        .quiz-option.disabled {
            pointer-events: none;
        }

        .quiz-feedback {
            margin-top: 16px;
            padding: 14px 18px;
            border-radius: 10px;
            font-weight: 600;
            display: none;
        }

        .quiz-feedback.show {
            display: block;
        }

        .quiz-feedback.correct {
            background: rgba(0, 200, 83, 0.1);
            color: var(--success);
        }

        .quiz-feedback.incorrect {
            background: rgba(255, 82, 82, 0.1);
            color: var(--error);
        }

        .quiz-retry {
            margin-top: 12px;
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }

        .quiz-retry.show {
            display: inline-block;
        }

        /* ===== PROGRESS BAR ===== */
        .sidebar-progress {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: var(--bg);
        }

        .progress-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--success) 100%);
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                padding: 80px 20px 32px;
            }

            .mobile-header {
                display: flex;
            }

            .device-title {
                font-size: 1.6rem;
            }

            .fab-grid {
                grid-template-columns: 1fr;
            }

            .specs-row {
                flex-direction: column;
            }

            .specs-label {
                width: 100%;
                padding: 12px 16px;
            }

            .specs-value {
                padding: 12px 16px;
            }
        }

        /* ===== WELCOME SCREEN ===== */
        .welcome {
            text-align: center;
            padding: 60px 20px;
        }

        .welcome-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .welcome-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
        }

        .welcome-text {
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto 30px;
        }

        .welcome-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 40px;
        }

        .welcome-stat {
            text-align: center;
        }

        .welcome-stat-num {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .welcome-stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
    </style>
</head>

    // ===== STATE =====
    let currentDevice = null;
    let completedQuizzes = JSON.parse(localStorage.getItem('completedQuizzes') || '[]');

    // ===== INIT =====
    function init() {
        renderSidebar();
        updateProgress();
        document.getElementById('totalDevices').textContent = DATA.devices.length;
        document.getElementById('learnedCount').textContent = completedQuizzes.length;
    }

    // ===== SIDEBAR =====
    function renderSidebar() {
        const nav = document.getElementById('sidebarNav');
        nav.innerHTML = '';

        DATA.categories.forEach(cat => {
            const devices = DATA.devices.filter(d => d.category === cat.id);
            if (devices.length === 0) return;

            const categoryDiv = document.createElement('div');
            categoryDiv.className = 'nav-category';
            categoryDiv.innerHTML = `<div class="nav-category-title">${cat.icon} ${cat.name}</div>`;

            devices.forEach(device => {
                const completed = completedQuizzes.includes(device.id);
                const item = document.createElement('div');
                item.className = `nav-item ${currentDevice?.id === device.id ? 'active' : ''}`;
                item.innerHTML = `
                    <span class="nav-item-icon">${device.icon}</span>
                    <span>${device.name}</span>
                    ${completed ? '<span class="nav-item-badge">✓</span>' : ''}
                `;
                item.onclick = () => selectDevice(device.id);
                categoryDiv.appendChild(item);
            });

            nav.appendChild(categoryDiv);
        });
    }

    // ===== SELECT DEVICE =====
    function selectDevice(deviceId) {
        currentDevice = DATA.devices.find(d => d.id === deviceId);
        if (!currentDevice) return;

        renderDevice();
        renderSidebar();
        closeSidebar();
    }

    // ===== RENDER DEVICE =====
    function renderDevice() {
        const device = currentDevice;
        const category = DATA.categories.find(c => c.id === device.category);

        const main = document.getElementById('mainContent');
        main.innerHTML = `
            <!-- Header -->
            <div class="device-header">
                <div class="device-category">${category.icon} ${category.name}</div>
                <div class="device-title">
                    <span class="device-title-icon">${device.icon}</span>
                    ${device.name}
                </div>
                <div class="device-tagline">${device.tagline}</div>
                ${device.chips ? `
                <div class="device-chips">
                    ${device.chips.map(chip => `
                        <span class="device-chip">
                            <span class="device-chip-icon">✨</span>
                            ${chip}
                        </span>
                    `).join('')}
                </div>
                ` : ''}
            </div>

            <!-- FAB Section -->
            <div class="section-title">Ключевые фишки (ХПВ)</div>
            <div class="fab-grid">
                ${device.fab.map((fab, i) => `
                    <div class="fab-card">
                        <div class="fab-icon">${fab.icon}</div>
                        <div>
                            <span class="fab-label feature">Характеристика</span>
                            <div class="fab-title">${fab.feature}</div>
                        </div>
                        <div style="margin-top:12px">
                            <span class="fab-label advantage">Преимущество</span>
                            <div class="fab-text">${fab.advantage}</div>
                        </div>
                        <div style="margin-top:12px">
                            <span class="fab-label benefit">Выгода для клиента</span>
                            <div class="fab-text">${fab.benefit}</div>
                        </div>
                    </div>
                `).join('')}
            </div>

            <!-- Specs Section -->
            <div class="specs-section">
                <div class="section-title">Технические характеристики</div>
                <div class="specs-table">
                    <div class="specs-row">
                        <div class="specs-label"><span class="specs-label-icon">📺</span> Экран</div>
                        <div class="specs-value">${device.specs.screen}</div>
                    </div>
                    <div class="specs-row">
                        <div class="specs-label"><span class="specs-label-icon">⚡</span> Процессор</div>
                        <div class="specs-value">${device.specs.cpu}</div>
                    </div>
                    <div class="specs-row">
                        <div class="specs-label"><span class="specs-label-icon">🔋</span> Батарея</div>
                        <div class="specs-value">${device.specs.battery}</div>
                    </div>
                    ${device.specs.camera !== '—' ? `
                    <div class="specs-row">
                        <div class="specs-label"><span class="specs-label-icon">📷</span> Камеры</div>
                        <div class="specs-value">${device.specs.camera}</div>
                    </div>
                    ` : ''}
                    ${device.specs.memory !== '—' ? `
                    <div class="specs-row">
                        <div class="specs-label"><span class="specs-label-icon">💾</span> Память</div>
                        <div class="specs-value">${device.specs.memory}</div>
                    </div>
                    ` : ''}
                    <div class="specs-row">
                        <div class="specs-label"><span class="specs-label-icon">🛡️</span> Защита</div>
                        <div class="specs-value">${device.specs.protection}</div>
                    </div>
                    <div class="specs-row">
                        <div class="specs-label"><span class="specs-label-icon">📐</span> Размеры</div>
                        <div class="specs-value">${device.specs.dimensions}</div>
                    </div>
                </div>
            </div>

            <!-- Quiz Section -->
            <div class="quiz-section">
                <div class="quiz-title">🎯 Проверь себя</div>
                <div class="quiz-question">${device.quiz.question}</div>
                <div class="quiz-options" id="quizOptions">
                    ${device.quiz.options.map((opt, i) => `
                        <div class="quiz-option" data-index="${i}" onclick="selectAnswer(${i})">${opt}</div>
                    `).join('')}
                </div>
                <div class="quiz-feedback" id="quizFeedback"></div>
                <button class="quiz-retry" id="quizRetry" onclick="resetQuiz()">Попробовать снова</button>
            </div>
        `;
    }

    // ===== QUIZ =====
    let selectedAnswer = null;

    function selectAnswer(index) {
        if (selectedAnswer !== null) return;
        
        selectedAnswer = index;
        const options = document.querySelectorAll('.quiz-option');
        const feedback = document.getElementById('quizFeedback');
        const retryBtn = document.getElementById('quizRetry');
        const correctIndex = currentDevice.quiz.correct;

        options.forEach((opt, i) => {
            opt.classList.add('disabled');
            if (i === correctIndex) {
                opt.classList.add('correct');
            } else if (i === index && index !== correctIndex) {
                opt.classList.add('incorrect');
            }
        });

        if (index === correctIndex) {
            feedback.textContent = '✅ Правильно! Отличная работа!';
            feedback.className = 'quiz-feedback show correct';
            
            if (!completedQuizzes.includes(currentDevice.id)) {
                completedQuizzes.push(currentDevice.id);
                localStorage.setItem('completedQuizzes', JSON.stringify(completedQuizzes));
                updateProgress();
                renderSidebar();
                document.getElementById('learnedCount').textContent = completedQuizzes.length;
            }
        } else {
            feedback.textContent = '❌ Неверно. Правильный ответ выделен зелёным.';
            feedback.className = 'quiz-feedback show incorrect';
            retryBtn.classList.add('show');
        }
    }

    function resetQuiz() {
        selectedAnswer = null;
        renderDevice();
    }

    // ===== PROGRESS =====
    function updateProgress() {
        const total = DATA.devices.length;
        const completed = completedQuizzes.length;
        const percent = Math.round((completed / total) * 100);
        
        document.getElementById('progressText').textContent = `${percent}%`;
        document.getElementById('progressFill').style.width = `${percent}%`;
    }

    // ===== MOBILE =====
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('show');
    }

    function closeSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
    }

    // ===== START =====
    init();
    </script>
