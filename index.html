<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Galaxy Mario - Samsung Training</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background: #5c94fc;
        }

        /* ===== ЭКРАНЫ ===== */
        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.3s;
            background: linear-gradient(180deg, #5c94fc 0%, #5c94fc 60%, #8bce8b 60%, #8bce8b 100%);
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title {
            font-size: clamp(2.5rem, 10vw, 4rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 4px 4px 0 #e52521, 6px 6px 0 #000;
            text-align: center;
            margin-bottom: 0.5rem;
            font-style: italic;
        }

        .subtitle {
            font-size: clamp(1rem, 4vw, 1.3rem);
            color: #fff;
            text-shadow: 2px 2px 0 #000;
            text-align: center;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 15px 40px;
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.primary {
            background: linear-gradient(180deg, #e52521 0%, #a01010 100%);
            color: #fff;
            box-shadow: 0 6px 0 #6a0a0a, 0 8px 10px rgba(0,0,0,0.3);
            border: 3px solid #fff;
        }

        .btn.secondary {
            background: linear-gradient(180deg, #049cd8 0%, #0366a0 100%);
            color: #fff;
            box-shadow: 0 6px 0 #024060, 0 8px 10px rgba(0,0,0,0.3);
            border: 3px solid #fff;
        }

        .stats-row {
            display: flex;
            gap: 20px;
            margin-top: 2rem;
        }

        .stat-box {
            background: rgba(0,0,0,0.3);
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
            border: 3px solid #fff;
        }

        .stat-val {
            font-size: 2rem;
            font-weight: bold;
            color: #fbd000;
            text-shadow: 2px 2px 0 #000;
        }

        .stat-lbl {
            color: #fff;
            font-size: 0.9rem;
            text-shadow: 1px 1px 0 #000;
        }

        /* ===== ВЫБОР УРОВНЯ ===== */
        .worlds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-height: 55vh;
            overflow-y: auto;
            padding: 15px;
            width: 100%;
            max-width: 700px;
        }

        .world-card {
            background: linear-gradient(180deg, #fbd000 0%, #e5a000 100%);
            border: 4px solid #fff;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 0 #8a6000;
            transition: transform 0.1s;
        }

        .world-card:active {
            transform: scale(0.95);
        }

        .world-card.completed {
            background: linear-gradient(180deg, #8bce8b 0%, #5a9a5a 100%);
            box-shadow: 0 4px 0 #3a6a3a;
        }

        .world-card.locked {
            background: linear-gradient(180deg, #888 0%, #555 100%);
            box-shadow: 0 4px 0 #333;
            opacity: 0.7;
        }

        .world-num {
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 2px 2px 0 #000;
        }

        .world-name {
            font-size: 0.75rem;
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            margin-top: 5px;
            line-height: 1.2;
        }

        /* ===== ИГРА ===== */
        .game-screen {
            background: #5c94fc;
            padding: 0;
        }

        .game-hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hud-item {
            color: #fff;
            font-weight: bold;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            text-shadow: 2px 2px 0 #000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-item .coin {
            color: #fbd000;
        }

        .hud-stars {
            display: flex;
            gap: 5px;
        }

        .hud-star {
            font-size: 1.3rem;
            opacity: 0.4;
            transition: all 0.3s;
        }

        .hud-star.got {
            opacity: 1;
            animation: starBounce 0.5s ease;
        }

        @keyframes starBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.5); }
        }

        /* Canvas игры */
        #gameCanvas {
            display: block;
            background: #5c94fc;
            image-rendering: pixelated;
        }

        /* Управление */
        .game-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 160px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.5) 100%);
            z-index: 100;
        }

        .ctrl-dpad {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(2, 55px);
            gap: 5px;
        }

        .ctrl-btn {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            border: 3px solid #fff;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            text-shadow: 1px 1px 0 #000;
        }

        .ctrl-btn:active {
            background: rgba(255,255,255,0.3);
        }

        .ctrl-btn.left { grid-column: 1; grid-row: 2; }
        .ctrl-btn.right { grid-column: 3; grid-row: 2; }
        .ctrl-btn.up { grid-column: 2; grid-row: 1; background: linear-gradient(180deg, #e52521, #a01010); }

        .ctrl-actions {
            display: flex;
            gap: 15px;
        }

        .ctrl-btn.jump {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(180deg, #e52521 0%, #a01010 100%);
            font-size: 0.9rem;
        }

        .ctrl-btn.action {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(180deg, #049cd8 0%, #0366a0 100%);
            font-size: 0.8rem;
        }

        /* ===== МОДАЛКИ ===== */
        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            padding: 20px;
        }

        .modal-bg.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(180deg, #5c94fc 0%, #3060c0 100%);
            border: 6px solid #fff;
            border-radius: 20px;
            padding: 25px;
            max-width: 450px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 0 rgba(0,0,0,0.3);
        }

        .modal-title {
            font-size: 1.6rem;
            font-weight: 900;
            color: #fbd000;
            text-shadow: 3px 3px 0 #000;
            text-align: center;
            margin-bottom: 15px;
        }

        .modal-text {
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            line-height: 1.6;
            margin-bottom: 15px;
            text-align: center;
        }

        .feature-block {
            background: rgba(0,0,0,0.3);
            border: 3px solid #fbd000;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .feature-name {
            font-weight: bold;
            color: #fbd000;
            text-shadow: 2px 2px 0 #000;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .feature-desc {
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .quiz-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: linear-gradient(180deg, #fbd000 0%, #e5a000 100%);
            border: 3px solid #fff;
            border-radius: 10px;
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
        }

        .quiz-btn:active, .quiz-btn.selected {
            background: linear-gradient(180deg, #fff 0%, #ddd 100%);
        }

        .quiz-btn.correct {
            background: linear-gradient(180deg, #8bce8b 0%, #5a9a5a 100%);
            color: #fff;
        }

        .quiz-btn.wrong {
            background: linear-gradient(180deg, #e52521 0%, #a01010 100%);
            color: #fff;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        /* Победа */
        .victory-screen {
            background: linear-gradient(180deg, #000 0%, #1a1a4a 100%);
        }

        .victory-title {
            font-size: clamp(2rem, 8vw, 3.5rem);
            font-weight: 900;
            color: #fbd000;
            text-shadow: 4px 4px 0 #e52521, 6px 6px 0 #000;
            text-align: center;
            margin-bottom: 20px;
        }

        .firework {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: firework 1s ease-out forwards;
        }

        @keyframes firework {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(20); opacity: 0; }
        }

        /* Responsive */
        @media (max-height: 600px) {
            .game-controls {
                height: 120px;
                padding: 10px;
            }
            .ctrl-dpad {
                grid-template-columns: repeat(3, 45px);
                grid-template-rows: repeat(2, 45px);
            }
            .ctrl-btn {
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
            }
            .ctrl-btn.jump {
                width: 65px;
                height: 65px;
            }
            .ctrl-btn.action {
                width: 55px;
                height: 55px;
            }
        }
    </style>
</head>

    <!-- МЕНЮ -->
    <div class="screen" id="menuScreen">
        <div class="title">GALAXY MARIO</div>
        <div class="subtitle">Samsung Training Adventure</div>
        <button class="btn primary" onclick="startGame()">ИГРАТЬ</button>
        <button class="btn secondary" onclick="showWorlds()">ВЫБОР МИРА</button>
        <div class="stats-row">
            <div class="stat-box">
                <div class="stat-val" id="statWorlds">0</div>
                <div class="stat-lbl">Миров</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="statCoins">0</div>
                <div class="stat-lbl">Монет</div>
            </div>
            <div class="stat-box">
                <div class="stat-val" id="statStars">0</div>
                <div class="stat-lbl">Звёзд</div>
            </div>
        </div>
    </div>

    <!-- ВЫБОР МИРА -->
    <div class="screen hidden" id="worldsScreen">
        <div class="title" style="font-size:2rem;margin-bottom:1rem;">ВЫБОР МИРА</div>
        <div class="worlds-grid" id="worldsGrid"></div>
        <button class="btn secondary" onclick="showMenu()" style="margin-top:15px;">НАЗАД</button>
    </div>

    <!-- ИГРА -->
    <div class="screen game-screen hidden" id="gameScreen">
        <div class="game-hud">
            <div class="hud-item">
                <span>МИР</span>
                <span id="hudWorld">1-1</span>
            </div>
            <div class="hud-item">
                <span class="coin">●</span>
                <span id="hudCoins">0</span>
            </div>
            <div class="hud-stars">
                <span class="hud-star" id="star1">⭐</span>
                <span class="hud-star" id="star2">⭐</span>
                <span class="hud-star" id="star3">⭐</span>
            </div>
            <div class="hud-item" style="cursor:pointer" onclick="showMenu()">МЕНЮ</div>
        </div>
        
        <canvas id="gameCanvas"></canvas>
        
        <div class="game-controls">
            <div class="ctrl-dpad">
                <button class="ctrl-btn up" id="btnUp">▲</button>
                <button class="ctrl-btn left" id="btnLeft">◀</button>
                <button class="ctrl-btn right" id="btnRight">▶</button>
            </div>
            <div class="ctrl-actions">
                <button class="ctrl-btn action" id="btnAction">❓</button>
                <button class="ctrl-btn jump" id="btnJump">ПРЫГ</button>
            </div>
        </div>
    </div>

    <!-- ПОБЕДА -->
    <div class="screen victory-screen hidden" id="victoryScreen">
        <div class="victory-title" id="vicTitle">МИР ПРОЙДЕН!</div>
        <div class="subtitle" id="vicText">Вы изучили все фишки!</div>
        <button class="btn primary" onclick="nextWorld()">ДАЛЬШЕ</button>
        <button class="btn secondary" onclick="showMenu()">МЕНЮ</button>
    </div>

    <!-- МОДАЛКА -->
    <div class="modal-bg" id="modalBg">
        <div class="modal" id="modalContent"></div>
    </div>

        onGround: false, facingRight: true,
        // Уровень
        platforms: [], questionBlocks: [], flagX: 0,
        cameraX: 0,
        // Управление
        keys: { left: false, right: false, jump: false },
        gameLoop: null
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ===== ЗАГРУЗКА/СОХРАНЕНИЕ =====
    function load() {
        try {
            const d = JSON.parse(localStorage.getItem('gm') || '{}');
            G.completed = d.completed || [];
            G.totalCoins = d.totalCoins || 0;
            G.totalStars = d.totalStars || 0;
            G.world = d.world || 0;
        } catch(e) {}
        updateStats();
    }

    function save() {
        localStorage.setItem('gm', JSON.stringify({
            completed: G.completed,
            totalCoins: G.totalCoins,
            totalStars: G.totalStars,
            world: G.world
        }));
    }

    function updateStats() {
        document.getElementById('statWorlds').textContent = G.completed.length;
        document.getElementById('statCoins').textContent = G.totalCoins;
        document.getElementById('statStars').textContent = G.totalStars;
    }

    // ===== НАВИГАЦИЯ =====
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function showMenu() {
        stopGame();
        showScreen('menuScreen');
        updateStats();
    }

    function showWorlds() {
        const grid = document.getElementById('worldsGrid');
        grid.innerHTML = '';
        
        DEVICES.forEach((dev, i) => {
            const done = G.completed.includes(i);
            const locked = i > 0 && !G.completed.includes(i - 1) && !done;
            
            const card = document.createElement('div');
            card.className = 'world-card' + (done ? ' completed' : '') + (locked ? ' locked' : '');
            card.innerHTML = `
                <div class="world-num">${locked ? '🔒' : (i + 1)}</div>
                <div class="world-name">${dev.name}</div>
            `;
            
            if (!locked) {
                card.onclick = () => { G.world = i; startGame(); };
            }
            
            grid.appendChild(card);
        });
        
        showScreen('worldsScreen');
    }

    // ===== ИГРА =====
    function startGame() {
        showScreen('gameScreen');
        resizeCanvas();
        initWorld(G.world);
        G.gameLoop = requestAnimationFrame(gameLoop);
    }

    function stopGame() {
        if (G.gameLoop) {
            cancelAnimationFrame(G.gameLoop);
            G.gameLoop = null;
        }
    }

    function resizeCanvas() {
        const hud = document.querySelector('.game-hud');
        const ctrl = document.querySelector('.game-controls');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - (hud?.offsetHeight || 50) - (ctrl?.offsetHeight || 160);
        canvas.style.marginTop = (hud?.offsetHeight || 50) + 'px';
    }

    function initWorld(idx) {
        const dev = DEVICES[idx];
        if (!dev) { showVictory(true); return; }

        // Сброс
        G.coins = 0;
        G.stars = [false, false, false];
        G.px = 100;
        G.py = 0;
        G.vx = 0;
        G.vy = 0;
        G.cameraX = 0;
        G.onGround = false;

        // HUD
        document.getElementById('hudWorld').textContent = `${idx + 1}`;
        document.getElementById('hudCoins').textContent = '0';
        document.querySelectorAll('.hud-star').forEach(s => s.classList.remove('got'));

        // Генерация уровня
        const levelWidth = 3000;
        G.flagX = levelWidth - 200;

        // Платформы
        G.platforms = [
            // Земля
            { x: 0, y: canvas.height - 60, w: levelWidth, h: 60, type: 'ground' }
        ];

        // Добавляем платформы
        for (let i = 0; i < 12; i++) {
            G.platforms.push({
                x: 300 + i * 220 + Math.random() * 50,
                y: canvas.height - 150 - Math.random() * 100,
                w: 100 + Math.random() * 60,
                h: 30,
                type: 'brick'
            });
        }

        // Блоки с вопросами (3 штуки для 3 фишек)
        G.questionBlocks = [
            { x: 500, y: canvas.height - 220, w: 50, h: 50, hit: false, starIdx: 0 },
            { x: 1200, y: canvas.height - 250, w: 50, h: 50, hit: false, starIdx: 1 },
            { x: 2000, y: canvas.height - 200, w: 50, h: 50, hit: false, starIdx: 2 }
        ];

        // Монеты
        G.coinItems = [];
        for (let i = 0; i < 25; i++) {
            G.coinItems.push({
                x: 200 + i * 100 + Math.random() * 50,
                y: canvas.height - 120 - Math.random() * 150,
                collected: false
            });
        }
    }

    // ===== ИГРОВОЙ ЦИКЛ =====
    function gameLoop() {
        update();
        render();
        G.gameLoop = requestAnimationFrame(gameLoop);
    }

    function update() {
        const gravity = 0.6;
        const speed = 5;
        const jumpForce = -14;
        const friction = 0.85;

        // Движение
        if (G.keys.left) {
            G.vx = -speed;
            G.facingRight = false;
        } else if (G.keys.right) {
            G.vx = speed;
            G.facingRight = true;
        } else {
            G.vx *= friction;
        }

        // Прыжок
        if (G.keys.jump && G.onGround) {
            G.vy = jumpForce;
            G.onGround = false;
        }

        // Гравитация
        G.vy += gravity;

        // Применение скорости
        G.px += G.vx;
        G.py += G.vy;

        // Коллизия с платформами
        G.onGround = false;
        const playerBox = { x: G.px, y: G.py, w: 40, h: 60 };

        for (const p of G.platforms) {
            if (collides(playerBox, p)) {
                // Падение сверху
                if (G.vy > 0 && G.py + 60 - G.vy <= p.y) {
                    G.py = p.y - 60;
                    G.vy = 0;
                    G.onGround = true;
                }
                // Удар снизу
                else if (G.vy < 0 && G.py - G.vy >= p.y + p.h) {
                    G.py = p.y + p.h;
                    G.vy = 0;
                }
            }
        }

        // Коллизия с блоками вопросов (снизу)
        for (const q of G.questionBlocks) {
            if (!q.hit && G.vy < 0) {
                const headBox = { x: G.px + 10, y: G.py, w: 20, h: 10 };
                if (collides(headBox, q)) {
                    q.hit = true;
                    G.vy = 0;
                    collectStar(q.starIdx);
                }
            }
            // Можно стоять на блоке
            if (collides(playerBox, q) && G.vy > 0 && G.py + 60 - G.vy <= q.y) {
                G.py = q.y - 60;
                G.vy = 0;
                G.onGround = true;
            }
        }

        // Сбор монет
        for (const c of G.coinItems) {
            if (!c.collected) {
                const dist = Math.hypot(G.px + 20 - c.x, G.py + 30 - c.y);
                if (dist < 30) {
                    c.collected = true;
                    G.coins++;
                    document.getElementById('hudCoins').textContent = G.coins;
                }
            }
        }

        // Граница слева
        if (G.px < 0) G.px = 0;

        // Падение вниз - респавн
        if (G.py > canvas.height + 100) {
            G.px = 100;
            G.py = 0;
            G.cameraX = 0;
        }

        // Камера
        const targetCam = G.px - canvas.width / 3;
        G.cameraX += (targetCam - G.cameraX) * 0.1;
        if (G.cameraX < 0) G.cameraX = 0;

        // Достижение флага
        if (G.px > G.flagX && G.stars.every(s => s)) {
            stopGame();
            completeWorld();
        }
    }

    function collides(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function collectStar(idx) {
        if (G.stars[idx]) return;
        G.stars[idx] = true;
        document.querySelectorAll('.hud-star')[idx].classList.add('got');
        
        // Показать фишку
        const dev = DEVICES[G.world];
        showModal(`
            <div class="modal-title">⭐ ФИШКА ${idx + 1}!</div>
            <div class="feature-block">
                <div class="feature-name">${dev.f[idx]}</div>
                <div class="feature-desc">${dev.d[idx]}</div>
            </div>
            <div class="modal-btns">
                <button class="btn primary" onclick="closeModal()">ВПЕРЁД!</button>
            </div>
        `);
    }

    // ===== РЕНДЕР =====
    function render() {
        const dev = DEVICES[G.world];
        
        // Фон - небо
        ctx.fillStyle = '#5c94fc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Облака (параллакс)
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 8; i++) {
            const cx = (i * 400 - G.cameraX * 0.3) % (canvas.width + 200) - 100;
            const cy = 50 + (i % 3) * 40;
            drawCloud(cx, cy);
        }

        // Холмы на фоне
        ctx.fillStyle = '#8bce8b';
        for (let i = 0; i < 5; i++) {
            const hx = (i * 600 - G.cameraX * 0.5) % (canvas.width + 400) - 200;
            ctx.beginPath();
            ctx.arc(hx, canvas.height - 60, 120, Math.PI, 0);
            ctx.fill();
        }

        ctx.save();
        ctx.translate(-G.cameraX, 0);

        // Платформы
        for (const p of G.platforms) {
            if (p.type === 'ground') {
                // Земля
                ctx.fillStyle = '#c84c0c';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.fillStyle = '#8bce8b';
                ctx.fillRect(p.x, p.y, p.w, 15);
            } else {
                // Кирпичи
                ctx.fillStyle = '#c84c0c';
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = '#8a3000';
                ctx.lineWidth = 2;
                // Линии кирпичей
                for (let bx = p.x; bx < p.x + p.w; bx += 25) {
                    ctx.beginPath();
                    ctx.moveTo(bx, p.y);
                    ctx.lineTo(bx, p.y + p.h);
                    ctx.stroke();
                }
            }
        }

        // Блоки вопросов
        for (const q of G.questionBlocks) {
            if (q.hit) {
                ctx.fillStyle = '#8a6000';
            } else {
                ctx.fillStyle = '#fbd000';
            }
            ctx.fillRect(q.x, q.y, q.w, q.h);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.strokeRect(q.x, q.y, q.w, q.h);
            
            if (!q.hit) {
                ctx.fillStyle = '#000';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('?', q.x + 25, q.y + 35);
            }
        }

        // Монеты
        ctx.fillStyle = '#fbd000';
        for (const c of G.coinItems) {
            if (!c.collected) {
                ctx.beginPath();
                ctx.arc(c.x, c.y, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#e5a000';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Флаг
        if (G.stars.every(s => s)) {
            // Флаг активен
            ctx.fillStyle = '#8a6000';
            ctx.fillRect(G.flagX + 20, canvas.height - 200, 10, 140);
            ctx.fillStyle = '#8bce8b';
            ctx.beginPath();
            ctx.moveTo(G.flagX + 30, canvas.height - 200);
            ctx.lineTo(G.flagX + 80, canvas.height - 170);
            ctx.lineTo(G.flagX + 30, canvas.height - 140);
            ctx.fill();
        } else {
            // Флаг заблокирован
            ctx.fillStyle = '#555';
            ctx.fillRect(G.flagX + 20, canvas.height - 200, 10, 140);
            ctx.fillStyle = '#888';
            ctx.beginPath();
            ctx.moveTo(G.flagX + 30, canvas.height - 200);
            ctx.lineTo(G.flagX + 80, canvas.height - 170);
            ctx.lineTo(G.flagX + 30, canvas.height - 140);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Собери ⭐⭐⭐', G.flagX + 45, canvas.height - 220);
        }

        // Персонаж (Марио в футболке Samsung)
        drawPlayer(G.px, G.py);

        ctx.restore();
    }

    function drawCloud(x, y) {
        ctx.beginPath();
        ctx.arc(x, y, 30, 0, Math.PI * 2);
        ctx.arc(x + 35, y - 10, 35, 0, Math.PI * 2);
        ctx.arc(x + 70, y, 30, 0, Math.PI * 2);
        ctx.arc(x + 35, y + 10, 25, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawPlayer(x, y) {
        ctx.save();
        if (!G.facingRight) {
            ctx.translate(x + 20, 0);
            ctx.scale(-1, 1);
            ctx.translate(-x - 20, 0);
        }

        // Ноги (синие штаны)
        ctx.fillStyle = '#1428a0';
        ctx.fillRect(x + 8, y + 42, 10, 18);
        ctx.fillRect(x + 22, y + 42, 10, 18);

        // Ботинки
        ctx.fillStyle = '#8a3000';
        ctx.fillRect(x + 5, y + 55, 13, 8);
        ctx.fillRect(x + 22, y + 55, 13, 8);

        // Тело (футболка Samsung - синяя)
        ctx.fillStyle = '#1428a0';
        ctx.fillRect(x + 5, y + 22, 30, 22);

        // Надпись SAMSUNG
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 6px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('SAMSUNG', x + 20, y + 36);

        // Руки
        ctx.fillStyle = '#ffdbac';
        ctx.fillRect(x, y + 24, 8, 15);
        ctx.fillRect(x + 32, y + 24, 8, 15);

        // Голова
        ctx.fillStyle = '#ffdbac';
        ctx.beginPath();
        ctx.arc(x + 20, y + 12, 14, 0, Math.PI * 2);
        ctx.fill();

        // Волосы (коричневые)
        ctx.fillStyle = '#4a2800';
        ctx.beginPath();
        ctx.arc(x + 20, y + 8, 14, Math.PI, 0);
        ctx.fill();

        // Глаза
        ctx.fillStyle = '#000';
        ctx.fillRect(x + 14, y + 10, 4, 4);
        ctx.fillRect(x + 24, y + 10, 4, 4);

        // Усы (как у Марио)
        ctx.fillStyle = '#4a2800';
        ctx.fillRect(x + 12, y + 17, 16, 3);

        // Нос
        ctx.fillStyle = '#ffb88c';
        ctx.beginPath();
        ctx.arc(x + 20, y + 14, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    // ===== ЗАВЕРШЕНИЕ МИРА =====
    function completeWorld() {
        if (!G.completed.includes(G.world)) {
            G.completed.push(G.world);
            G.totalStars += 3;
        }
        G.totalCoins += G.coins;
        save();

        // Показать квиз
        showQuiz();
    }

    function showQuiz() {
        const dev = DEVICES[G.world];
        
        const allFeatures = new Set();
        DEVICES.forEach(d => d.f.forEach(f => allFeatures.add(f)));
        
        const correct = dev.f;
        const wrong = [...allFeatures].filter(f => !correct.includes(f));
        const shuffledWrong = wrong.sort(() => Math.random() - 0.5).slice(0, 3);
        const options = [...correct, ...shuffledWrong].sort(() => Math.random() - 0.5);

        let html = `
            <div class="modal-title">🏁 ФИНАЛЬНЫЙ ТЕСТ</div>
            <div class="modal-text">Выбери 3 главные фишки ${dev.name}:</div>
        `;
        
        options.forEach(opt => {
            html += `<button class="quiz-btn" data-f="${opt}" onclick="toggleQuiz(this)">${opt}</button>`;
        });

        html += `
            <div class="modal-btns">
                <button class="btn primary" onclick="checkQuiz()">ПРОВЕРИТЬ</button>
            </div>
        `;

        showModal(html);
    }

    function toggleQuiz(btn) {
        const selected = document.querySelectorAll('.quiz-btn.selected');
        if (btn.classList.contains('selected')) {
            btn.classList.remove('selected');
        } else if (selected.length < 3) {
            btn.classList.add('selected');
        }
    }

    function checkQuiz() {
        const dev = DEVICES[G.world];
        const selected = [...document.querySelectorAll('.quiz-btn.selected')].map(b => b.dataset.f);
        
        let correct = 0;
        document.querySelectorAll('.quiz-btn').forEach(btn => {
            const f = btn.dataset.f;
            const isCorrect = dev.f.includes(f);
            const isSelected = selected.includes(f);
            
            if (isCorrect) {
                btn.classList.add('correct');
                if (isSelected) correct++;
            } else if (isSelected) {
                btn.classList.add('wrong');
            }
        });

        setTimeout(() => {
            if (correct === 3) {
                closeModal();
                showVictory(false);
            } else {
                document.getElementById('modalContent').innerHTML = `
                    <div class="modal-title">❌ ПОПРОБУЙ ЕЩЁ!</div>
                    <div class="modal-text">Правильно: ${correct} из 3<br>Запомни фишки и попробуй снова!</div>
                    <div class="modal-btns">
                        <button class="btn primary" onclick="closeModal(); startGame();">ЗАНОВО</button>
                        <button class="btn secondary" onclick="closeModal(); showMenu();">МЕНЮ</button>
                    </div>
                `;
            }
        }, 1000);
    }

    function showVictory(final) {
        const vic = document.getElementById('victoryScreen');
        
        if (final) {
            document.getElementById('vicTitle').textContent = '🏆 ВСЕ МИРЫ ПРОЙДЕНЫ!';
            document.getElementById('vicText').textContent = `Вы изучили все ${DEVICES.length} устройств Samsung!`;
        } else {
            document.getElementById('vicTitle').textContent = '🎉 МИР ПРОЙДЕН!';
            document.getElementById('vicText').textContent = `${DEVICES[G.world].name} изучен! Монет: ${G.coins}`;
        }
        
        showScreen('victoryScreen');
        createFireworks();
    }

    function nextWorld() {
        G.world++;
        if (G.world >= DEVICES.length) {
            showVictory(true);
        } else {
            startGame();
        }
    }

    function createFireworks() {
        const colors = ['#e52521', '#fbd000', '#049cd8', '#8bce8b', '#fff'];
        const cont = document.getElementById('victoryScreen');
        
        for (let i = 0; i < 15; i++) {
            setTimeout(() => {
                const fw = document.createElement('div');
                fw.className = 'firework';
                fw.style.left = Math.random() * 100 + '%';
                fw.style.top = Math.random() * 60 + '%';
                fw.style.background = colors[Math.floor(Math.random() * colors.length)];
                cont.appendChild(fw);
                setTimeout(() => fw.remove(), 1000);
            }, i * 200);
        }
    }

    // ===== МОДАЛКИ =====
    function showModal(html) {
        document.getElementById('modalContent').innerHTML = html;
        document.getElementById('modalBg').classList.add('active');
    }

    function closeModal() {
        document.getElementById('modalBg').classList.remove('active');
    }

    // ===== УПРАВЛЕНИЕ =====
    // Клавиатура
    document.addEventListener('keydown', e => {
        if (document.getElementById('gameScreen').classList.contains('hidden')) return;
        if (document.getElementById('modalBg').classList.contains('active')) return;
        
        switch(e.code) {
            case 'ArrowLeft': case 'KeyA': G.keys.left = true; break;
            case 'ArrowRight': case 'KeyD': G.keys.right = true; break;
            case 'ArrowUp': case 'KeyW': case 'Space': G.keys.jump = true; break;
        }
    });

    document.addEventListener('keyup', e => {
        switch(e.code) {
            case 'ArrowLeft': case 'KeyA': G.keys.left = false; break;
            case 'ArrowRight': case 'KeyD': G.keys.right = false; break;
            case 'ArrowUp': case 'KeyW': case 'Space': G.keys.jump = false; break;
        }
    });

    // Сенсорное управление
    function setupTouch(btn, key) {
        const start = () => G.keys[key] = true;
        const end = () => G.keys[key] = false;
        
        btn.addEventListener('mousedown', start);
        btn.addEventListener('touchstart', e => { e.preventDefault(); start(); });
        btn.addEventListener('mouseup', end);
        btn.addEventListener('mouseleave', end);
        btn.addEventListener('touchend', end);
        btn.addEventListener('touchcancel', end);
    }

    setupTouch(document.getElementById('btnLeft'), 'left');
    setupTouch(document.getElementById('btnRight'), 'right');
    setupTouch(document.getElementById('btnUp'), 'jump');
    setupTouch(document.getElementById('btnJump'), 'jump');

    // Кнопка действия - показать материалы
    document.getElementById('btnAction').addEventListener('click', () => {
        if (document.getElementById('gameScreen').classList.contains('hidden')) return;
        const dev = DEVICES[G.world];
        let html = `<div class="modal-title">📖 ${dev.name}</div>`;
        dev.f.forEach((f, i) => {
            const got = G.stars[i];
            html += `
                <div class="feature-block" style="opacity:${got ? 1 : 0.5}">
                    <div class="feature-name">${got ? '⭐' : '❓'} ${f}</div>
                    <div class="feature-desc">${got ? dev.d[i] : 'Разбей блок с вопросом!'}</div>
                </div>
            `;
        });
        html += `<div class="modal-btns"><button class="btn primary" onclick="closeModal()">ИГРАТЬ</button></div>`;
        showModal(html);
    });

    // Resize
    window.addEventListener('resize', () => {
        if (!document.getElementById('gameScreen').classList.contains('hidden')) {
            resizeCanvas();
        }
    });

    // ===== INIT =====
    load();
    </script>
</body>
</html>
